name: Eslatmalar

on:
  schedule:
    # Each run covers 6 hours of Uzbekistan time (UTC+5) and waits for each reminder.
    - cron: "0 22 * * *"   # 03:00–09:00
    - cron: "0 4 * * *"    # 09:00–15:00
    - cron: "0 10 * * *"   # 15:00–21:00
    - cron: "0 16 * * *"   # 21:00–03:00
  workflow_dispatch:
    inputs:
      mode:
        description: "setup = botni ulash, test = sinov xabari"
        type: choice
        options: [test, setup]
        default: test

permissions:
  actions: write
  contents: write

concurrency:
  group: eslatma-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Keep the schedule alive
        # GitHub pauses schedules after 60 days without activity; re-enabling resets that.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/eslatma.yml/enable" || true
      - name: Send reminders
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || vars.CHAT_ID }}
          GOALS: ${{ secrets.GOALS }}
          CITY: ${{ vars.CITY }}
          MODE: ${{ inputs.mode || 'window' }}
          WINDOW_START: >-
            ${{ github.event.schedule == '0 22 * * *' && '3'
             || github.event.schedule == '0 4 * * *' && '9'
             || github.event.schedule == '0 10 * * *' && '15'
             || github.event.schedule == '0 16 * * *' && '21' || '0' }}
        run: python bot.py
      - name: Save chat id
        if: inputs.mode == 'setup'
        run: |
          git config user.name "maqsadlar-bot"
          git config user.email "maqsadlar-bot@users.noreply.github.com"
          git add chat_id.txt
          git diff --cached --quiet || (git commit -m "Save Telegram chat id" && git push)
